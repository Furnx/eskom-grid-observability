[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eskom-grid"
version = "0.3.3"
description = "Eskom Grid Observability — extraction logic and dbt/DuckDB transformation for EskomSePush loadshedding schedules."
readme = "README.md"
requires-python = ">=3.10"
# Core: only what the extraction logic itself needs. Keep this minimal — it is
# exactly what gets installed into the Lambda image.
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Writing to S3 (Lambda gets boto3 from the runtime; containers and laptops do not).
s3 = ["boto3>=1.34"]

# Running the dbt transformation. Installed into the transform Lambda's image,
# and depended on by the dagster extra so the pins live in exactly one place.
# Pinned to minor versions: the landing model relies on DuckDB skipping files
# for a literal filter on the file name, which is behaviour, not documented API.
transform = [
    "dbt-core==1.11.*",
    "dbt-duckdb==1.10.*",
    "duckdb==1.5.*",
]

# Local orchestration. Never installed into either Lambda.
dagster = [
    "eskom-grid[transform]",
    "dagster",
    "dagster-webserver",
    "dagster-dbt",
    "python-dotenv",
]

dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The area portfolio ships inside the package so an installed copy is self-contained.
eskom_grid = ["areas_config.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: builds the real dbt project; a few seconds each. Skip with -m 'not slow'.",
]

[tool.dagster]
module_name = "defs"
