[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eskom-grid"
version = "0.1.0"
description = "Eskom Grid Observability — extraction logic and dbt/DuckDB transformation for EskomSePush loadshedding schedules."
readme = "README.md"
requires-python = ">=3.10"
# Core: only what the extraction logic itself needs. Keep this minimal — it is
# exactly what gets installed into the Lambda image.
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Writing to S3 (Lambda gets boto3 from the runtime; containers and laptops do not).
s3 = ["boto3>=1.34"]
# Local orchestration and transformation. Never installed into Lambda.
dagster = [
    "dagster",
    "dagster-webserver",
    "dagster-dbt",
    "dbt-core>=1.11.0",
    "dbt-duckdb",
    "duckdb",
    "python-dotenv",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The area portfolio ships inside the package so an installed copy is self-contained.
eskom_grid = ["areas_config.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.dagster]
module_name = "defs"
